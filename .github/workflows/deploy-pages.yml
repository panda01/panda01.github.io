# Builds the frontend (apps/web) and publishes it to GitHub Pages as a static site.
# Only the frontend is deployed: it has no runtime dependency on the Express server (apps/server).
#
# One-time setup (repository Settings → Pages): set "Build and deployment → Source" to "GitHub Actions".
# Without it, the configure-pages step fails.
#
# Each action is pinned to a full commit SHA, with its release version in a trailing comment.

name: Deploy to GitHub Pages

on:
  # Every push to the default branch publishes the site.
  push:
    branches: [master]
  # Lets the site be republished by hand from the Actions tab, e.g. after adding a custom domain.
  workflow_dispatch:

# The minimum GITHUB_TOKEN permissions GitHub Pages needs to deploy.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deployment at a time. A run queued behind an in-progress one waits;
# an in-progress deployment is never cancelled part-way through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Typecheck, lint, format check and unit tests with coverage. A failure here stops the deploy.
      - name: Verify
        run: npm run verify

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # base_path is "/khalah-portfolio" on panda01.github.io and "" on a custom domain, so the
      # same workflow builds for either address. `base` is passed here rather than set in
      # vite.config.mts so the dev server, E2E tests and unit tests keep serving from "/".
      - name: Build the frontend
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build --workspace @khalah/web -- --base="${PAGES_BASE_PATH}/"

      - name: Upload the built site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
