; Republishes Chromium's loopback-only DevTools port (9223) on 0.0.0.0:9222 inside the container.
; compose.yaml publishes 9222 on the host's 127.0.0.1 only, so it is never reachable from other machines.
[program:devtools-forwarder]
command=/usr/bin/socat TCP-LISTEN:9222,fork,reuseaddr TCP:127.0.0.1:9223
autorestart=true
priority=900
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/devtools-forwarder.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true
